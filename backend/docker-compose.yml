version: "3.8"

services:
  redis:
    image: redis:7.2-alpine
    container_name: ticket-redis
    ports:
      - "6380:6379"
    networks:
      - backend-network
    # volumes:
    #   - ./backend/redis_data:/data
  api-server:
    image: ${NCP_REGISTRY_URL}/beastcamp-api-server:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: backend/api-server/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    networks:
      - backend-network

  ticket-server:
    image: ${NCP_REGISTRY_URL}/beastcamp-ticket-server:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: backend/ticket-server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge
